edf2ef;color:var(--green)}.btn.danger{background:#fff0f0;color:var(--red)}.btn.smallbtn{padding:6px 9px;font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:13px;color:#53635d;font-weight:600}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #d8e1dc;border-radius:8px;padding:10px 11px;background:#fff;outline:none}.field input:focus,.field select:focus,.search:focus{border-color:#4b8b78;box-shadow:0 0 0 3px #4b8b781a}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:650;background:#fafcfb}td strong{font-weight:650}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#eaf4ef;color:#28654f;font-size:11px}.tag.warn{background:#fff3df;color:#91601b}.empty{padding:30px;text-align:center;color:var(--muted)}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#10231f88;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:#fff;border-radius:15px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0;font-size:19px}.close{border:0;background:#eef2ef;border-radius:8px;padding:7px 10px}.actions{display:flex;gap:7px}.barrow{display:grid;grid-template-columns:95px 1fr 65px;gap:9px;align-items:center;margin:12px 0;font-size:12px}.barbg{height:10px;background:#edf1ef;border-radius:20px;overflow:hidden}.barfill{height:100%;background:#4e8b78;border-radius:20px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#173d35,#315d51)}.loginbox{width:min(420px,100%);background:#fff;padding:30px;border-radius:18px;box-shadow:0 20px 60px #0003}.loginbox h1{font-size:22px;margin:12px 0 3px}.loginbox .gem{margin:auto}.toast{position:fixed;right:20px;bottom:20px;background:#183d35;color:#fff;padding:12px 16px;border-radius:10px;z-index:20;box-shadow:0 6px 25px #0002}.language{border:1px solid var(--line);border-radius:8px;padding:7px;background:#fff;color:var(--green)}.mobilemenu{display:none}
@media(max-width:900px){.sidebar{width:210px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:650px){.shell{display:block}.sidebar{width:100%;padding:12px;gap:10px}.brand{padding-bottom:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.sidefoot{display:none}.topbar{height:56px;padding:0 14px}.content{padding:17px}.cards{gap:9px}.card{padding:13px}.metric{font-size:21px}.pagehead{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.topbar .right{gap:6px}}
:root{--green:#16483f;--green2:#276b5b;--silver:#dce6e3;--gold:#e5b86b;--bg:#eef2ef;--ink:#1b302c;--muted:#687b75;--line:#dce5e1;--white:#fff;--red:#b44d4d;--blue:#497d91}
body{font-family:"Segoe UI",Tahoma,sans-serif;background:linear-gradient(135deg,#f3f5f1 0%,#e9f0ed 100%);color:var(--ink)}
.shell{min-height:100vh}
.sidebar{width:258px;background:linear-gradient(175deg,#143d36 0%,#1a5147 62%,#27534d 100%);padding:24px 16px 18px;gap:22px;box-shadow:4px 0 20px #163c3512}
.brand{gap:12px;padding:5px 8px 20px;border-color:#ffffff30}
.brand strong{font-family:Georgia,"Times New Roman",serif;font-size:15px;letter-spacing:0}
.brand small{display:block;margin-top:3px;color:#d0dfd9;font-size:12px}
.gem{width:44px;height:44px;flex:0 0 44px;border-radius:10px;background:var(--gold);color:#284b41;box-shadow:0 4px 12px #080f0d26}
.nav{gap:6px}
.nav button{position:relative;border-radius:7px;padding:11px 12px;color:#d5e2dd;transition:background .16s ease,color .16s ease,transform .16s ease}
.nav button:hover{background:#ffffff12;transform:translateX(2px)}
.nav button.active{background:#ffffff19;box-shadow:inset 3px 0 var(--gold);color:#fff}
.sidefoot{border-top:1px solid #ffffff25;padding:14px 8px 2px;color:#c1d2cc;line-height:1.6}
.main{min-height:100vh}
.topbar{height:68px;padding:0 30px;background:#ffffffed;border-bottom:1px solid #dfe7e3;box-shadow:0 2px 12px #213c3310;backdrop-filter:blur(12px)}
.topbar #topTitle{font-size:13px;color:#465a54}
.topbar .right{gap:10px}
.content{max-width:1540px;padding:30px 32px 38px}
.pagehead{margin-bottom:20px;align-items:center}
.pagehead h1{font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:600;line-height:1.2;color:#1b3932}
.pagehead .muted{margin-top:5px}
.cards{gap:13px;margin-bottom:18px}
.card,.panel{position:relative;min-width:0;border:1px solid #dce5e1;border-radius:8px;background:#fff;box-shadow:0 3px 12px #183d3510}
.card{overflow:hidden;padding:17px 18px 18px 20px;transition:transform .16s ease,box-shadow .16s ease}
.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--accent,var(--green))}
.card:nth-child(2){--accent:var(--blue)}.card:nth-child(3){--accent:#d4a557}.card:nth-child(4){--accent:#a45e50}
.card:hover{transform:translateY(-2px);box-shadow:0 7px 17px #183d3517}
.panel{padding:18px}
.metriclabel{font-size:12px;font-weight:600;color:#71817c}
.metric{font-size:27px;font-weight:700;color:#1b3932;font-variant-numeric:tabular-nums}
.grid2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:15px}
.panel h3{font-size:15px;font-weight:700;color:#29463e;margin-bottom:13px}
.btn{border-radius:7px;padding:10px 14px;background:var(--green);box-shadow:0 2px 5px #163d351b;transition:background .16s ease,transform .16s ease,box-shadow .16s ease}
.btn:hover{background:var(--green2);box-shadow:0 4px 10px #163d3524;transform:translateY(-1px)}
.btn.secondary{background:#edf2ef;color:#38554c;box-shadow:none;border:1px solid #dce5e1}
.btn.secondary:hover{background:#e2ebe6;color:#173d35}
.btn.danger{background:#fff0ee;color:#a34138;border:1px solid #f1d4d0;box-shadow:none}
.btn.danger:hover{background:#f9e1dd}
.btn.smallbtn{border-radius:6px;padding:6px 9px}
.field{gap:6px;margin-bottom:13px}
.field label{font-size:12px;color:#53675f}
.field input,.field select,.field textarea,.search,.topbar select{width:100%;border:1px solid #ccd9d3;border-radius:7px;background:#fff;color:var(--ink);padding:10px 11px;transition:border-color .15s ease,box-shadow .15s ease}
.topbar select{width:auto;padding:8px 10px}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus,.topbar select:focus{border-color:#4b8b78;box-shadow:0 0 0 3px #4b8b781f;outline:none}
.formgrid{gap:13px}
.staff-form-section h3,.staff-pin-section h3{margin:0 0 10px;font-size:13px;color:#29463e}
.staff-pin-section{border-top:1px solid var(--line);margin:14px 0 16px;padding-top:14px}
.staff-pin-section p{margin:0;color:var(--muted)}
.cloud-setup-panel{grid-column:1/-1}
.tablewrap{min-width:0;max-width:100%;overflow:auto;border:1px solid #e1e8e4;border-radius:7px;background:#fff}
table{border-collapse:collapse}
th,td{padding:11px 12px;border-bottom:1px solid #e6ece9}
th{background:#f3f7f4;color:#53675f;font-size:11px;font-weight:700;text-transform:uppercase;white-space:nowrap}
tbody tr{transition:background .12s ease}
tbody tr:hover{background:#f7faf8}
tbody tr:last-child td{border-bottom:0}
td{font-size:13px}
td strong{color:#25483d}
.tag{border-radius:5px;background:#e6f1eb;color:#2d6c51;padding:4px 8px;font-size:11px;font-weight:700}
.tag.warn{background:#fff0df;color:#9a672b}
.empty{padding:24px;color:#778781;border:1px dashed #cbd8d2;border-radius:7px;background:#f9fbfa}
.barbg{height:8px;border-radius:6px;background:#e7eeea;overflow:hidden}
.barfill{height:100%;border-radius:6px;background:linear-gradient(90deg,#397d68,#73aa90)}
.modalback{background:#10231f9c;backdrop-filter:blur(3px)}
.modal{border:1px solid #dce5e1;border-radius:10px;box-shadow:0 22px 65px #0e29234a}
.modalhead{border-bottom:1px solid #e3eae6;margin-bottom:16px;padding-bottom:13px}
.modalhead h2{font-family:Georgia,"Times New Roman",serif;color:#1b3932;font-size:22px}
.close{border-radius:6px;background:#edf2ef;color:#435c53}
.close:hover{background:#e0e9e4}
.actions{gap:9px;flex-wrap:wrap}
.barrow{gap:12px}
.panel:has(#saleSubtotal){border-left:4px solid var(--blue);background:linear-gradient(110deg,#f1f7f8,#fff)}
#saleSubtotal{color:#315f70!important;font-size:22px!important;font-variant-numeric:tabular-nums}
.panel:has(#saleDiscount){background:#fffaf1;border-color:#efe3cd}
.discount-field{flex:1;min-width:0}
.discount-field input{width:100%;min-width:0;padding:10px 11px;border:1px solid #ccd9d3;border-radius:7px;background:#fff;color:var(--ink);font:inherit}
.discount-field input:focus{border-color:#4b8b78;box-shadow:0 0 0 3px #4b8b781f;outline:none}
.panel:has(#oldExchangeAmount) #oldExchangeAmount{display:inline-block;padding:4px 9px;border-radius:6px;background:#edf4ef;color:#31664f;font-variant-numeric:tabular-nums}
.panel:has(#saleNetFinal){border:1px solid #d5b16b;border-left:5px solid #c69442;background:linear-gradient(115deg,#f0f7f3,#fff7e9);box-shadow:0 6px 18px #74603918}
.panel:has(#saleNetFinal) .barrow{flex-wrap:wrap;align-items:center;gap:10px}
#saleNetFinal{display:inline-block;padding:7px 12px;border-radius:7px;background:#e4efe8;color:#19483d!important;font-size:26px!important;font-variant-numeric:tabular-nums}
.language{border-radius:7px}
.login{background:linear-gradient(135deg,#143d36 0%,#1e5b4d 58%,#987b50 150%);padding:22px}
.loginbox{border:1px solid #ffffff8c;border-radius:10px;box-shadow:0 22px 60px #082a2450;padding:30px;background:#fbfcfa}
.loginbox h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;color:#1b3932}
.loginbox .gem{margin:0 auto 12px}
.toast{border-radius:7px;box-shadow:0 7px 22px #122a2440}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e5b86b88;outline-offset:2px}
@media(max-width:1100px){.sidebar{width:230px}.content{padding:24px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:650px){.sidebar{width:100%;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px #163d351c}.brand{padding:3px 7px 12px}.nav{gap:4px}.nav button{border-radius:6px;padding:9px 10px}.topbar{padding:0 14px}.content{padding:19px 14px 28px}.pagehead h1{font-size:24px}.panel{padding:14px}.card{padding:15px 13px}.metric{font-size:22px}.topbar .right{gap:5px}.topbar .right .small{display:none}.loginbox{padding:23px 19px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body>
<div id="login" class="login">
 <div class="loginbox">
  <div class="gem">◇</div><h1 style="text-align:center">MS SILVER PALACE</h1><p class="muted" style="text-align:center;margin-top:0">Silver Jewellery CRM & Stock Manager</p>
    <div class="field"><label>Supabase project URL</label><input id="supabaseUrl" type="url" placeholder="https://your-project.supabase.co" autocomplete="url"></div>

    <p class="small muted">Use the Supabase Auth account assigned to you. Project URL and public anon key are saved only in this browser.</p>
 </div>
</div>
<div id="app" class="shell hidden">
 <aside class="sidebar">
  <div class="brand"><div class="gem">◇</div><div><strong>MS SILVER PALACE</strong><small>Silver Jewellery CRM</small></div></div>
  <nav class="nav" id="nav">
   <button data-page="dashboard" class="active" onclick="showPage('dashboard')">▦ <span data-en="Dashboard" data-ta="முகப்பு">Dashboard</span></button>
   <button data-page="customers" onclick="showPage('customers')">♙ <span data-en="Customers" data-ta="வாடிக்கையாளர்கள்">Customers</span></button>
  <button data-page="stock" class="owner-only hidden" onclick="showPage('stock')">◇ <span data-en="Stock register" data-ta="சரக்கு பதிவு">Stock register</span></button>
   <button data-page="sales" onclick="showPage('sales')">▤ <span data-en="Sales & billing" data-ta="விற்பனை மற்றும் பில்">Sales & billing</span></button>
  <button data-page="analytics" class="owner-only hidden" onclick="showPage('analytics')">▥ <span data-en="Analytics" data-ta="பகுப்பாய்வு">Analytics</span></button>

<script>
const KEY='mssp_crm_demo_v1';
const CLOUD_KEY='mssp_crm_cloud_config_v1';
let db={customers:[],stock:[],sales:[],suppliers:[],staff:[],seq:1};
let page='dashboard',lang='en',analyticsStockPeriod='All Time',analyticsSalesPeriod='All Time',loginMode='owner',currentUser={role:'owner',name:'Owner'};
let cloudClient=null,cloudUser=null,cloudRole=null,cloudChannel=null,cloudSaveTimer=null,cloudPollTimer=null,cloudWriteInProgress=false,cloudApplying=false,cloudVersion=0;
const $=id=>document.getElementById(id);
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const grams=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:3})+' g';
function load(){try{db={...db,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}db.staff=[]}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(db))}
function save(){saveLocal();if(cloudClient&&cloudUser&&cloudRole&&!cloudApplying)scheduleCloudSave()}
function cloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}')}catch(e){return {}}}
function prefillAuthConfig(){let config=cloudConfig();if($('supabaseUrl'))$('supabaseUrl').value=config.url||'';if($('supabaseAnonKey'))$('supabaseAnonKey').value=config.anonKey||''}
prefillAuthConfig()
function setCloudStatus(message){let status=$('cloudStatus');if(status)status.textContent=message}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function scheduleCloudSave(){clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(()=>{cloudSaveTimer=null;syncCloudSnapshot()},500)}
async function syncCloudSnapshot(){if(!cloudClient||!cloudUser||!cloudRole||cloudApplying)return false;if(cloudWriteInProgress){scheduleCloudSave();return false}cloudWriteInProgress=true;try{let safeData={...db,staff:[]};let {data,error}=await cloudClient.rpc('save_crm_snapshot',{p_data:safeData,p_expected_version:cloudVersion});if(error)throw error;cloudVersion=Number(data?.version)||cloudVersion+1;setCloudStatus('Connected · synced');return true}catch(error){setCloudStatus(error.code==='40001'?'Data changed on another device · reload cloud data':(error.message||'Sync failed'));toast(error.message||'Cloud sync failed');return false}finally{cloudWriteInProgress=false}}
function normalizeCloudData(data){return {...db,...data,staff:[],suppliers:Array.isArray(data.suppliers)?data.suppliers:[],seq:cloudRole==='owner'?(data.seq||1):1}}
function applyCloudSnapshot(snapshot,backupLocal=false){if(!snapshot?.data)return;if(backupLocal)localStorage.setItem(KEY+'_before_cloud_'+Date.now(),JSON.stringify(db));cloudVersion=Number(snapshot.version)||1;cloudApplying=true;db=normalizeCloudData(snapshot.data);saveLocal();if(page!=='settings')render();cloudApplying=false;setCloudStatus('Connected · updated from cloud')}
async function pollCloudSnapshot(){if(!cloudClient||!cloudUser||cloudSaveTimer||cloudWriteInProgress)return;let {data,error}=await cloudClient.rpc('read_crm_snapshot');if(error){setCloudStatus(error.message||'Cloud refresh failed');return}if(data&&Number(data.version)>cloudVersion)applyCloudSnapshot(data,true)}
function subscribeToCloud(){clearInterval(cloudPollTimer);cloudPollTimer=setInterval(pollCloudSnapshot,5000);setCloudStatus('Connected · live sync on')}
function stableCloudJson(value){if(Array.isArray(value))return '['+value.map(stableCloudJson).join(',')+']';if(value&&typeof value==='object')return '{'+Object.keys(value).sort().map(key=>JSON.stringify(key)+':'+stableCloudJson(value[key])).join(',')+'}';return JSON.stringify(value)}
function hasLocalCloudData(){return db.customers.length>0||db.stock.length>0||db.sales.length>0}
async function activateCloud(user){let {data:member,error:memberError}=await cloudClient.from('shop_members').select('user_id,display_name,email,role').eq('user_id',user.id).maybeSingle();if(memberError)throw memberError;if(!member||!['owner','staff'].includes(member.role))throw new Error('This account is not assigned to this shop');cloudUser=user;cloudRole=member.role;let {data:snapshot,error}=await cloudClient.rpc('read_crm_snapshot');if(error)throw error;if(snapshot){let localHasData=hasLocalCloudData(),localData={...db,staff:[]},cloudData={...snapshot.data,staff:[]},localMatches=stableCloudJson(localData)===stableCloudJson(cloudData),ownerNeedsBackup=!localMatches&&localHasData&&cloudRole==='owner';if(ownerNeedsBackup){localStorage.setItem(KEY+'_before_cloud_'+Date.now(),JSON.stringify(db));if(!confirm('Cloud data already exists. Replace this device’s local data with the cloud copy? A local backup will be kept.'))throw new Error('Sign-in cancelled; local data was kept')}applyCloudSnapshot(snapshot,ownerNeedsBackup);if(cloudRole==='owner'&&Array.isArray(snapshot.data.staff)&&snapshot.data.staff.length&&!await syncCloudSnapshot())throw new Error('Could not remove legacy staff PIN data from the cloud snapshot')}else{if(cloudRole!=='owner')throw new Error('The owner must initialize the shared CRM before staff can sign in');if(hasLocalCloudData()&&!confirm('No cloud snapshot exists. Upload this device’s current data as the shared cloud copy?'))throw new Error('Sign-in cancelled; local data was kept');cloudVersion=0;if(!await syncCloudSnapshot())throw new Error('Could not initialize the shared CRM')}subscribeToCloud();return member}

function parsedRecordDate(value){if(!value)return null;if(/^\d{4}-\d{2}-\d{2}/.test(value)){let date=new Date(value);return Number.isNaN(date.getTime())?null:date}let match=String(value).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(match){let date=new Date(Number(match[3]),Number(match[2])-1,Number(match[1]));return Number.isNaN(date.getTime())?null:date}let date=new Date(value);return Number.isNaN(date.getTime())?null:date}
function inPeriod(record,period,kind){if(period==='All Time')return true;let date=parsedRecordDate(record.createdAt||(kind==='stock'?record.added:record.date));if(!date)return false;let now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(period==='This Week'){start.setDate(start.getDate()-(start.getDay()+6)%7)}else if(period==='This Month')start.setDate(1);else if(period==='This Year')start.setMonth(0,1);return date>=start&&date<=now}

function saleItemChanged(){let item=db.stock.find(x=>x.id===$('saleStock')?.value);if($('saleProductName'))$('saleProductName').value=item?item.name:'';if($('saleProductWeight'))$('saleProductWeight').value=item?grams(item.weight):'';calculateSale()}
function calculateSale(){let item=db.stock.find(x=>x.id===$('saleStock')?.value),weight=item?Number(item.weight):0,rate=Number($('salePricePerGram')?.value||0),subtotal=Math.round(weight*rate*100)/100,discount=Number($('saleDiscount')?.value||0),saleFinal=Math.max(0,Math.round((subtotal-discount)*100)/100),exchangeEnabled=!!$('oldExchangeToggle')?.checked,oldWeight=exchangeEnabled?Number($('oldWeight')?.value||0):0,purity=exchangeEnabled?Number($('oldPurity')?.value||0):0,oldRate=exchangeEnabled?Number($('oldPricePerGram')?.value||0):0,pureWeight=Math.round(oldWeight*purity)/100,exchangeAmount=Math.round(pureWeight*oldRate*100)/100,final=Math.round((saleFinal-exchangeAmount)*100)/100,paid=Number($('salePaid')?.value||0),due=Math.max(0,final-paid);if($('saleSubtotal'))$('saleSubtotal').textContent=money(subtotal);if($('oldExchangeAmount'))$('oldExchangeAmount').textContent=money(exchangeAmount);if($('saleNetFinal'))$('saleNetFinal').textContent=money(final);if($('saleDueText'))$('saleDueText').textContent=final<0?'Customer credit: '+money(Math.abs(final)):'Balance due: '+money(due);return {item,weight,rate,subtotal,discount,saleFinal,final,paid,exchangeEnabled,oldProductName:$('oldProductName')?.value.trim()||'',oldWeight,purity,pureWeight,oldRate,exchangeAmount}}
function completeSale(){let cid=$('saleCustomer').value,calc=calculateSale(),c=db.customers.find(x=>x.id===cid),paymentType=$('salePaymentType').value;if(!calc.item||!c||!calc.rate||calc.rate<=0||calc.discount<0||calc.discount>calc.subtotal||calc.paid<0||calc.paid>Math.max(0,calc.final)||(calc.exchangeEnabled&&(!calc.oldProductName||calc.oldWeight<=0||calc.purity<=0||calc.purity>100||calc.oldRate<=0)))return toast('Check customer, rate, discount, exchange details and amount received');let item=calc.item,now=new Date();item.status='Sold';item.soldAt=now.toISOString();let sale={id:'INV-'+String(db.sales.length+1).padStart(6,'0'),customerId:cid,customerName:c.name,date:now.toLocaleDateString('en-IN'),createdAt:now.toISOString(),itemsText:item.name+' ('+item.id+')',stockId:item.id,weight:calc.weight,pricePerGram:calc.rate,subtotal:calc.subtotal,discount:calc.discount,total:calc.final,paid:calc.paid,due:Math.max(0,Math.round((calc.final-calc.paid)*100)/100),paymentType,oldExchangeEnabled:calc.exchangeEnabled,oldProductName:calc.oldProductName,oldWeight:calc.oldWeight,oldPurity:calc.purity,oldPureWeight:calc.pureWeight,oldPricePerGram:calc.oldRate,oldExchangeAmount:calc.exchangeAmount};db.sales.push(sale);c.count++;c.total+=calc.final;save();closeModal();render();toast('Sale completed · '+sale.id)}
function quickSell(id){let x=db.stock.find(i=>i.id===id);if(!x)return;showPage('sales');saleModal(id)}
function analyticsPage(){title('Analytics / பகுப்பாய்வு');let stockAdded=db.stock.filter(x=>inPeriod(x,analyticsStockPeriod,'stock')),periodSales=db.sales.filter(x=>inPeriod(x,analyticsSalesPeriod,'sales')),stockSold=periodSales.filter(s=>s.stockId||s.itemsText).length,availableCount=db.stock.filter(x=>x.status==='In stock'&&inPeriod(x,analyticsStockPeriod,'stock')).length,periodStockWeight=stockAdded.reduce((sum,x)=>sum+x.weight,0),salesValue=periodSales.reduce((sum,x)=>sum+x.total,0),paid=periodSales.reduce((sum,x)=>sum+x.paid,0),due=periodSales.reduce((sum,x)=>sum+x.due,0),stockPurities=[...new Set(db.stock.map(x=>String(x.purity||'Other')))],categories=[...new Set(db.stock.map(x=>x.category))];$('view').innerHTML=`<div class="pagehead"><div><h1>Business analytics</h1><div class="muted small">Live summaries calculated from recorded demo data</div></div><button class="btn secondary" onclick="exportCSV()">Export sales CSV</button></div><section class="panel"><h3>Stock Register Analytics</h3>${periodButtons(analyticsStockPeriod,'setStockPeriod')}<div class="cards"><div class="card"><div class="metriclabel">Pieces added</div><div class="metric">${stockAdded.length}</div></div><div class="card"><div class="metriclabel">Sold pieces</div><div class="metric">${stockSold}</div></div><div class="card"><div class="metriclabel">Available pieces</div><div class="metric">${availableCount}</div></div><div class="card"><div class="metriclabel">Weight added</div><div class="metric">${grams(periodStockWeight)}</div></div></div><div class="grid2"><div><h3>Stock weight by purity</h3>${stockPurities.map(purity=>{let amount=stockAdded.filter(x=>String(x.purity||'Other')===purity).reduce((sum,x)=>sum+x.weight,0);return `<div class="barrow"><span>${esc(purity)}</span><div class="barbg"><div class="barfill" style="width:${periodStockWeight?100*amount/periodStockWeight:0}%"></div></div><b>${grams(amount)}</b></div>`}).join('')||'<div class="empty">No stock data.</div>'}</div><div><h3>Stock by category</h3>${categories.length?categories.map(category=>`<p>${esc(category)} <b style="float:right">${stockAdded.filter(x=>x.category===category).length} pieces</b></p>`).join(''):'<div class="empty">No stock data.</div>'}</div></div></section><section class="panel" style="margin-top:16px"><h3>Sales Analytics</h3>${periodButtons(analyticsSalesPeriod,'setSalesPeriod')}<div class="cards"><div class="card"><div class="metriclabel">Sales value</div><div class="metric">${money(salesValue)}</div></div><div class="card"><div class="metriclabel">Transactions</div><div class="metric">${periodSales.length}</div></div><div class="card"><div class="metriclabel">Payments received</div><div class="metric">${money(paid)}</div></div><div class="card"><div class="metriclabel">Customer dues</div><div class="metric">${money(due)}</div></div></div></section>`}
function setStockPeriod(period){analyticsStockPeriod=period;analyticsPage()}
function setSalesPeriod(period){analyticsSalesPeriod=period;analyticsPage()}
function staffPage(){title('Staff accounts');$('view').innerHTML=`<div class="pagehead"><div><h1>Staff accounts</h1><div class="muted small">Staff log in with their own Supabase Auth email and password.</div></div></div><div class="panel"><h3>Provision a staff account</h3><ol><li>Create the user in Supabase Authentication → Users.</li><li>Copy the user's ID and email.</li><li>Run the membership SQL shown below, replacing the values.</li></ol><pre>insert into public.shop_members (user_id, display_name, role, email) values ('USER_UUID', 'Staff Name', 'staff', 'STAFF_EMAIL');</pre></div><div class="panel" id="staffMembers"><div class="empty">Loading team accounts…</div></div>`;loadStaffMembers()}
async function loadStaffMembers(){let target=$('staffMembers');if(!target)return;if(!cloudClient||cloudRole!=='owner'){target.innerHTML='<div class="empty">Sign in as the owner to view staff accounts.</div>';return}let {data,error}=await cloudClient.from('shop_members').select('user_id,display_name,email,role,created_at').order('created_at');if(error){target.innerHTML=`<div class="empty">Could not load team accounts: ${esc(error.message)}</div>`;return}let members=(data||[]).filter(member=>member.role==='staff');target.innerHTML=members.length?table(['Name','Email','Role','Account ID'],members.map(member=>[esc(member.display_name),esc(member.email||'—'),'<span class="tag">Staff</span>',`<code>${esc(member.user_id)}</code>`])):'<div class="empty">No staff accounts are linked yet.</div>'}
function settingsPage(){let config=cloudConfig();title('Settings & account');$('view').innerHTML=`<div class="pagehead"><div><h1>Settings & account</h1><div class="muted small">Supabase Auth controls access and cloud sync for this device.</div></div></div><div class="grid2"><div class="panel cloud-setup-panel"><h3>Secure cloud connection</h3><div id="cloudStatus" class="tag" style="display:inline-block;margin-bottom:12px">${cloudUser?'Connected · live sync on':'Not connected'}</div><p>Signed in as <b>${esc(cloudUser?.email||'—')}</b> · Role: <b>${esc(cloudRole||'—')}</b></p><p class="muted small">This device uses project URL ${esc(config.url||'not configured')}. The public anon key is saved in this browser; passwords are never saved by the app.</p><div class="actions">${btn('Sign out','logout()','secondary')}</div></div><div class="panel"><h3>Export backup</h3><p class="muted small">Download customers, stock and sales as a JSON backup file.</p>${btn('Download backup','backup()')}</div><div class="panel"><h3>Restore backup</h3><p class="muted small">Restore a previously exported JSON backup.</p><input type="file" id="restoreFile" accept=".json"><br><br>${btn('Restore selected file','restore()','secondary')}</div><div class="panel"><h3>Reload latest cloud data</h3><p class="muted small">Use this after another device reports a save conflict. A local backup is kept before replacing this browser's data.</p>${btn('Reload cloud data','reloadCloudData()','secondary')}</div></div>`}
</script>
</body></html>
